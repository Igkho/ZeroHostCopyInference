name: Docker Build, Test & Push

on:
  push:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-test-push:
    runs-on: self-hosted

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Download ONNX Model
        run: |
          mkdir -p models
          wget https://github.com/Igkho/CropAndWeedDetection/releases/download/1.0.1-int8-weights/best_int8.onnx -O models/best_int8.onnx

      - name: Log in to the Container registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build Docker image locally
        uses: docker/build-push-action@v4
        with:
          context: .
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Run GPU Unit Tests
        run: |
          IMAGE_TAG="${{ steps.meta.outputs.tags }}"
          
          docker run --rm --gpus all \
            -v ${{ github.workspace }}/models:/app/models \
            --entrypoint /app/build/ZeroCopyInferenceTests \
            $IMAGE_TAG \
            --model /app/models/best_int8.onnx

      - name: Push Docker image
        if: success()
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}